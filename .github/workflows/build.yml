name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release for the version in CMakeLists.txt
        type: boolean
        default: false

# Compiled objects are kept in the GitHub Actions cache, so a build only
# compiles what changed since the last one.
env:
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MSVC, Qt 6.8, FFmpeg 8.1)
    runs-on: windows-latest
    env:
      QT_VERSION: 6.8.3
      FFMPEG_ZIP: ffmpeg-n8.1-latest-win64-gpl-shared-8.1
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtmultimedia qtimageformats
          cache: true

      # Cached, so the FFmpeg DLLs stay the same from release to release and
      # app updates only carry the files that really changed.
      - name: Cache FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_ZIP }}-v1

      - name: Download FFmpeg (BtbN shared build)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$env:FFMPEG_ZIP.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg"

      - name: Locate FFmpeg
        shell: pwsh
        run: '"FFMPEG_ROOT=$env:RUNNER_TEMP\ffmpeg\$env:FFMPEG_ZIP" | Out-File -FilePath $env:GITHUB_ENV -Append'

      # ONNX Runtime for the local AI tools (face / plate blur, background
      # removal). Cached like FFmpeg so its DLL stays the same between releases.
      - name: Cache ONNX Runtime
        id: ort-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/onnxruntime
          key: onnxruntime-win-x64-1.22.0-v1

      - name: Download ONNX Runtime
        if: steps.ort-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-win-x64-1.22.0.zip"
          Invoke-WebRequest -Uri $url -OutFile ort.zip
          Expand-Archive ort.zip -DestinationPath "$env:RUNNER_TEMP\onnxruntime"
          # The debug symbols are most of the archive and not needed.
          Remove-Item "$env:RUNNER_TEMP\onnxruntime\onnxruntime-win-x64-1.22.0\lib\*.pdb"

      - name: Cache LibRaw (vcpkg)
        id: libraw-cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-libraw-x64-windows-v1

      - name: Install LibRaw (camera RAW photos)
        if: steps.libraw-cache.outputs.cache-hit != 'true'
        run: vcpkg install libraw:x64-windows

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure
        shell: pwsh
        run: |
          # The vcpkg DLLs are on PATH while configuring, so the tests find them.
          $env:PATH = "C:\vcpkg\installed\x64-windows\bin;$env:PATH"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows -DLUMORA_REQUIRE_LIBRAW=ON `
            "-DLUMORA_ONNXRUNTIME_ROOT=$env:RUNNER_TEMP/onnxruntime/onnxruntime-win-x64-1.22.0" `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build build

      - name: Test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:PATH = "$env:FFMPEG_ROOT\bin;C:\vcpkg\installed\x64-windows\bin;$env:PATH"
          ctest --test-dir build --output-on-failure
          if ($LASTEXITCODE -ne 0) {
            # The test log can drown in encoder output; rerun the failures with Qt Test's own log.
            foreach ($t in Get-ChildItem build\tests\tst_*.exe) {
              & $t.FullName -o "$($t.BaseName).log,txt" 2>$null | Out-Null
              $code = $LASTEXITCODE
              if ($code -ne 0) {
                Write-Host "::group::$($t.BaseName) exited with $code"
                Get-Content "$($t.BaseName).log" -ErrorAction SilentlyContinue
                Write-Host "::endgroup::"
              }
            }
            exit 1
          }

      - name: Package
        shell: pwsh
        run: |
          $dist = "dist\LumoraStudio"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item build\src\app\LumoraStudio.exe $dist
          windeployqt --release --no-compiler-runtime --dir $dist "$dist\LumoraStudio.exe"
          Copy-Item "$env:FFMPEG_ROOT\bin\*.dll" $dist
          Copy-Item C:\vcpkg\installed\x64-windows\bin\*.dll $dist
          Copy-Item build\src\app\onnxruntime*.dll $dist
          # The Visual C++ runtime goes in the folder too, so the app starts on
          # a PC without the redistributable installed.
          Copy-Item "$env:VCToolsRedistDir\x64\Microsoft.VC*.CRT\*.dll" $dist
          foreach ($dll in 'msvcp140.dll', 'msvcp140_1.dll', 'vcruntime140.dll', 'vcruntime140_1.dll', 'avcodec-62.dll') {
            if (-not (Test-Path "$dist\$dll")) { throw "$dll is missing from the package" }
          }
          if (-not (Test-Path "$dist\raw*.dll")) { throw "LibRaw is missing from the package" }
          if (-not (Test-Path "$dist\onnxruntime.dll")) { throw "ONNX Runtime is missing from the package" }
          # Turkish strings for Qt's own buttons (OK, Close, Cancel...).
          if (-not (Test-Path "$dist\translations\qt_tr.qm")) { throw "translations\qt_tr.qm is missing from the package" }
          Copy-Item README.md, docs\ozellikler.md $dist
          Copy-Item "$env:FFMPEG_ROOT\LICENSE.txt" "$dist\FFmpeg-LICENSE.txt" -ErrorAction SilentlyContinue

      - name: Smoke test the package
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\LumoraStudio\LumoraStudio.exe `
               -ArgumentList '--screenshot', "$env:RUNNER_TEMP\smoke.png" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "LumoraStudio did not exit" }
          if ($p.ExitCode -ne 0) { throw "LumoraStudio exited with $($p.ExitCode)" }
          if (-not (Test-Path "$env:RUNNER_TEMP\smoke.png")) { throw "No screenshot written" }

      - uses: actions/upload-artifact@v4
        with:
          name: LumoraStudio-windows-x64
          path: dist/LumoraStudio

  linux:
    name: Linux (GCC, Qt 6.4, FFmpeg 6.1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            qt6-base-dev qt6-multimedia-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            qt6-image-formats-plugins libgl-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            libraw-dev espeak-ng

      # A spoken sentence and the smallest Whisper model for the end-to-end
      # speech recognition test.
      - name: Speech test data
        uses: actions/cache@v4
        with:
          path: ~/whisper-models
          key: whisper-ggml-tiny-v1

      - name: Prepare speech test
        run: |
          mkdir -p ~/whisper-models
          [ -f ~/whisper-models/ggml-tiny.bin ] || curl -sSfL -o ~/whisper-models/ggml-tiny.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          espeak-ng -v en-us -s 140 -w "$RUNNER_TEMP/speech.wav" "Hello world. This is a test of automatic subtitles."
          echo "LUMORA_WHISPER_MODEL=$HOME/whisper-models/ggml-tiny.bin" >> "$GITHUB_ENV"
          echo "LUMORA_SPEECH_WAV=$RUNNER_TEMP/speech.wav" >> "$GITHUB_ENV"

      # The small picture models and a test photo for the face, number plate
      # and background removal tests.
      - name: Vision test data
        uses: actions/cache@v4
        with:
          path: ~/vision-models
          key: vision-models-v1

      - name: Prepare vision tests
        run: |
          mkdir -p ~/vision-models
          cd ~/vision-models
          get() { [ -f "$1" ] || curl -sSfL -o "$1" "$2"; }
          get face_detection_yunet_2023mar.onnx https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
          get yolo-v9-t-640-license-plates-end2end.onnx https://github.com/ankandrew/open-image-models/releases/download/assets/yolo-v9-t-640-license-plates-end2end.onnx
          get u2netp.onnx https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx
          get face.jpg https://raw.githubusercontent.com/opencv/opencv/4.x/samples/data/lena.jpg
          echo "LUMORA_VISION_MODELS=$HOME/vision-models" >> "$GITHUB_ENV"
          echo "LUMORA_FACE_IMAGE=$HOME/vision-models/face.jpg" >> "$GITHUB_ENV"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUMORA_REQUIRE_LIBRAW=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

  # Pushing a tag such as v0.2.0, or running the workflow on main with
  # "release" ticked, publishes a GitHub release with the Windows package;
  # the app's updater downloads it from there.
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Work out the release tag
        run: |
          version=$(sed -nE 's/^ +VERSION ([0-9.]+)$/\1/p' CMakeLists.txt | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $version in CMakeLists.txt"
            exit 1
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: LumoraStudio-windows-x64
          path: LumoraStudio

      # Besides the whole package: manifest.json (every file's checksum) and a
      # patch with only the files changed since the previous release, which
      # is all the updater downloads when it is enough.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          if [ -n "$previous" ]; then
            gh release download "$previous" -p manifest.json -O previous-manifest.json || true
          fi
          python3 .github/scripts/release_manifest.py --package LumoraStudio --version "${TAG#v}" \
            --out manifest.json --previous previous-manifest.json --patch-dir patch
          zip -r -q LumoraStudio-windows-x64.zip LumoraStudio
          assets="LumoraStudio-windows-x64.zip manifest.json"
          if [ -d patch ]; then
            (cd patch && zip -r -q ../LumoraStudio-windows-x64-patch.zip LumoraStudio)
            assets="$assets LumoraStudio-windows-x64-patch.zip"
          fi
          gh release create "$TAG" $assets --target "$GITHUB_SHA" \
            --title "LumoraStudio ${TAG#v}" --generate-notes
